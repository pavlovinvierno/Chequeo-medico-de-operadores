<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fbf">
  <meta name="description" content="Registro de chequeo médico de operadores de autobús">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Chequeo Médico</title>
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">SERVICIO MÉDICO</div>
      <h1>Chequeo de operadores</h1>
    </div>
    <button id="newBtn" class="icon-btn" type="button" title="Nuevo registro">＋</button>
  </header>

  <main class="container">
    <div id="status" class="status" role="status">Registro local activado</div>

    <form id="checkupForm" novalidate>
      <section class="card">
        <h2>Datos del registro</h2>
        <div class="grid two">
          <label>Fecha
            <input id="fecha" name="fecha" type="date" required>
          </label>
          <label>Hora
            <input id="hora" name="hora" type="time" required>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Operador</h2>
        <label>Número de empleado
          <input id="empleado" name="empleado" type="text" inputmode="numeric" autocomplete="off" required>
        </label>
        <label>Nombre
          <input id="nombre" name="nombre" type="text" autocomplete="name" required>
        </label>
        <div class="grid two">
          <fieldset>
            <legend>Diabetes mellitus (DM)</legend>
            <div class="segmented">
              <label><input type="radio" name="dm" value="Sí" required><span>Sí</span></label>
              <label><input type="radio" name="dm" value="No"><span>No</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Hipertensión arterial (HTA)</legend>
            <div class="segmented">
              <label><input type="radio" name="hta" value="Sí" required><span>Sí</span></label>
              <label><input type="radio" name="hta" value="No"><span>No</span></label>
            </div>
          </fieldset>
        </div>
      </section>

      <section class="card">
        <h2>Pruebas y destino</h2>
        <label>Antidoping
          <select id="antidoping" name="antidoping" required>
            <option value="">Seleccionar…</option>
            <option>Negativo</option>
            <option>Positivo</option>
            <option>No realizado</option>
          </select>
        </label>
        <label>Alcoholímetro
          <input id="alcoholimetro" name="alcoholimetro" type="number" inputmode="decimal" min="0" step="0.001" placeholder="Valor medido">
        </label>
        <label>Destino
          <input id="destino" name="destino" type="text" placeholder="Ruta / destino">
        </label>
      </section>

      <section class="card">
        <h2>Signos y mediciones</h2>
        <div class="grid two">
          <label>Tensión arterial
            <input id="ta" name="ta" type="text" inputmode="text" placeholder="120/80">
          </label>
          <label>Temperatura corporal (°C)
            <input id="temperatura" name="temperatura" type="number" inputmode="decimal" min="30" max="45" step="0.1" placeholder="36.5">
          </label>
          <label>Glucosa (mg/dL)
            <input id="glucosa" name="glucosa" type="number" inputmode="decimal" min="20" max="600" step="0.1">
          </label>
          <label>Peso (kg)
            <input id="peso" name="peso" type="number" inputmode="decimal" min="20" max="300" step="0.1">
          </label>
          <label>Frecuencia cardiaca (lpm)
            <input id="fc" name="fc" type="number" inputmode="numeric" min="20" max="250">
          </label>
          <label>SpO₂ (%)
            <input id="spo2" name="spo2" type="number" inputmode="numeric" min="0" max="100">
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Resultado de la valoración</h2>
        <fieldset>
          <legend>Aptitud</legend>
          <div class="aptitude">
            <label><input type="radio" name="apto" value="Sí" required><span class="apto">APTO</span></label>
            <label><input type="radio" name="apto" value="No"><span class="no-apto">NO APTO</span></label>
          </div>
        </fieldset>
        <label>Motivo
          <textarea id="motivo" name="motivo" rows="2" placeholder="Motivo de valoración"></textarea>
        </label>
        <label>Observación
          <textarea id="observacion" name="observacion" rows="3" placeholder="Hallazgos o notas relevantes"></textarea>
        </label>
        <label>Atendió
          <input id="atendio" name="atendio" type="text" autocomplete="name" required>
        </label>
      </section>

      <button class="primary" type="submit">GUARDAR REGISTRO</button>
      <button class="secondary" type="button" id="historyBtn">VER REGISTROS GUARDADOS</button>
    </form>

    <section id="history" class="card hidden">
      <div class="section-head">
        <h2>Registros guardados</h2>
        <button id="closeHistory" class="text-btn" type="button">Cerrar</button>
      </div>
      <div id="historyList"></div>
      <button id="exportBtn" class="secondary" type="button">EXPORTAR CSV</button>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
